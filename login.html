<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión - IntelliBank</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#003bb3,#c9a13b);
    min-height:100vh;
}

/* NAVBAR */

nav{
    width:100%;
    background:#001d66;
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav h2{
    color:white;
}

nav ul{
    display:flex;
    list-style:none;
    gap:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

/* LOGIN */

.contenedor{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:60px;
}

.login-box{
    background:white;
    width:380px;
    padding:35px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
    text-align:center;
}

.login-box img{
    width:150px;
    margin-bottom:20px;
}

.login-box h1{
    color:#003bb3;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    background:linear-gradient(to right,#003bb3,#c9a13b);
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.texto{
    margin-top:18px;
}

.texto a{
    color:#003bb3;
    text-decoration:none;
}
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.popup-box{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    width:300px;
    box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.popup-box button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    background:#003bb3;
    color:white;
    border-radius:10px;
    cursor:pointer;
}.logo-link{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:white;
}

.logo{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
}
</style>
</head>

<body>

<nav>

    <a href="Index.html" class="logo-link">
    <img src="logo.jpeg" class="logo">
    <h2>IntelliBank</h2>
</a>

    <ul>
        <li><a href="Index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="infoia.html">AI</a></li>
        <li><a href="prestamos.html">Préstamos</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="cuenta.html">Perfil</a></li>
    </ul>

</nav>

<div class="contenedor">

    <div class="login-box">

        <img src="logo.jpeg">

        <h1>Iniciar Sesión</h1>

        <input type="text" id="usuario" placeholder="Usuario">

        <input type="password" id="contrasena" placeholder="Contraseña">

        <button onclick="iniciarSesion()">
            Entrar
        </button>

        <div class="texto">
            ¿No tienes cuenta?
            <a href="crearcuenta.html">
                Crear cuenta
            </a>
        </div>

    </div>

</div>

<script>

function iniciarSesion(){

    let usuario = document.getElementById("usuario").value.trim();
    let contrasena = document.getElementById("contrasena").value;

    let cuenta = localStorage.getItem(usuario);

    if(cuenta == null){
        mostrarError(); 
        return;
    }

    let datos = JSON.parse(cuenta);

    if(datos.contrasena === contrasena){

        // GUARDAR USUARIO ACTIVO
        localStorage.setItem("usuarioActivo", usuario);

        // MOSTRAR POPUP DE ÉXITO
        mostrarExito();

    } else {

        // MOSTRAR ERROR
        mostrarError();

    }
}
function mostrarExito(){
    document.getElementById("popupExito").style.display = "flex";
}

function cerrarExito(){
    document.getElementById("popupExito").style.display = "none";
    window.location.href = "cuenta.html";
}

function mostrarError(){
    document.getElementById("popupError").style.display = "flex";
}

function cerrarError(){
    document.getElementById("popupError").style.display = "none";
}function mostrarExito(){
    document.getElementById("popupExito").style.display = "flex";
}

function cerrarExito(){
    document.getElementById("popupExito").style.display = "none";

    // ir a la cuenta después de aceptar
    window.location.href = "cuenta.html";
}

function mostrarError(){
    document.getElementById("popupError").style.display = "flex";
}

function cerrarError(){
    document.getElementById("popupError").style.display = "none";
}
</script>
<!-- POPUP ÉXITO -->
<div id="popupExito" class="popup">
    <div class="popup-box">
        <h2>Inicio de sesión correcto ✅</h2>
        <button onclick="cerrarExito()">OK</button>
    </div>
</div>

<!-- POPUP ERROR -->
<div id="popupError" class="popup">
    <div class="popup-box">
        <h2>Revisa usuario o contraseña ❌</h2>
        <button onclick="cerrarError()">OK</button>
    </div>
</div>
</body>
</html>
